<!-- ============================================================
     模拟试卷元信息
     生成日期：2026-09-21
     命题：AI 辅助命题（同类型题，非历年原题）
     覆盖：教材第2版 11章 + 贯穿层
     答案分布校验：A19 / B18 / C19 / D19（最大连续同答案 1 题）
     ============================================================ -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2b6cb0;--blue-l:#eef5ff;--line:#dfe3e8;--txt:#1f2733;--gray:#6b7684;
  --ok:#2f855a;--bad:#c53030;--warn:#b7791f;--bg:#f4f6f8;
}
body{background:var(--bg);color:var(--txt);font:15px/1.7 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-text-size-adjust:100%}

/* ===== 顶栏 ===== */
.hd{position:fixed;top:0;left:0;right:0;height:58px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 16px;z-index:60}
.hd .logo{font-weight:700;font-size:16px;color:var(--blue);white-space:nowrap;text-decoration:none}
.hd .sub{color:var(--gray);font-size:13px;border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.hd .spacer{flex:1}
.timer{font:700 18px/1 Consolas,Monaco,monospace;color:var(--txt);background:#f0f3f7;border:1px solid var(--line);
       border-radius:6px;padding:8px 12px;letter-spacing:1px}
.timer.warn{color:#fff;background:var(--bad);border-color:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.btn{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:6px;padding:8px 14px;
     font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#245c96;color:#fff}
.btn.danger{color:var(--bad);border-color:#f0c0c0}

/* ===== 布局 ===== */
.wrap{max-width:1220px;margin:0 auto;padding:74px 16px 96px;display:grid;grid-template-columns:1fr 302px;gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.q-area{padding:22px 26px 26px;min-height:420px}
.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
       padding-bottom:12px;border-bottom:1px dashed var(--line)}
.q-no{font-weight:700;color:var(--blue);font-size:15px}
.q-stem{font-size:17px;line-height:1.95;margin-bottom:20px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;
     padding:13px 15px;cursor:pointer;transition:.12s;background:#fff}
.opt:hover{border-color:var(--blue);background:#fafcff}
.opt .lt{flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:50%;
         background:#eef1f5;color:var(--gray);font-weight:700;font-size:13px}
.opt .tx{flex:1;line-height:1.7}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.sel .lt{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:#f0fff4}
.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fff5f5}
.opt.wrong .lt{background:var(--bad);color:#fff}

/* ===== 答题卡 ===== */
.sheet{padding:16px;position:sticky;top:74px}
.sheet h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 span{font-size:12px;color:var(--gray);font-weight:400}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--gray);margin-bottom:12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gi{height:32px;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:12px;cursor:pointer;background:#fff;user-select:none}
.gi:hover{border-color:var(--blue)}
.gi.done{background:var(--blue);border-color:var(--blue);color:#fff}
.gi.mark{border-color:var(--warn);border-width:2px;color:var(--warn);font-weight:700}
.gi.done.mark{color:#fff}
.gi.cur{outline:2px solid #1a365d;outline-offset:1px}
.gi.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gi.no{background:var(--bad);border-color:var(--bad);color:#fff}
.gi.skip{background:#edf0f4;color:var(--gray)}

/* ===== 底栏 ===== */
.bar{position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);
     display:flex;align-items:center;justify-content:center;gap:14px;z-index:60;padding:0 16px}
.bar .prog{font-size:13px;color:var(--gray);min-width:120px;text-align:center}

/* ===== 开始遮罩 ===== */
.mask{position:fixed;inset:0;background:rgba(23,32,44,.72);display:flex;align-items:center;justify-content:center;
      z-index:100;padding:18px}
.mask .box{background:#fff;border-radius:12px;padding:28px 30px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.mask h2{font-size:20px;margin-bottom:6px}
.mask .desc{color:var(--gray);font-size:13px;margin-bottom:16px}
.mask table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:18px}
.mask td{border:1px solid var(--line);padding:9px 12px}
.mask td:first-child{background:#f8fafc;color:var(--gray);width:96px}
.mask .acts{display:flex;gap:10px;flex-wrap:wrap}
.hide{display:none!important}

/* ===== 结果 ===== */
.res{padding:22px 26px}
.res .score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.res .big{font:700 42px/1 Consolas,monospace;color:var(--blue)}
.res .pass{font-size:15px;font-weight:700;padding:4px 12px;border-radius:20px}
.res .pass.y{background:#f0fff4;color:var(--ok);border:1px solid #9ae6b4}
.res .pass.n{background:#fff5f5;color:var(--bad);border:1px solid #feb2b2}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--gray);margin:12px 0 18px}
.stat b{color:var(--txt)}
.wrong-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.wrong-tbl th,.wrong-tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.wrong-tbl th{background:#f8fafc;color:var(--gray);font-weight:600;white-space:nowrap}
.wrong-tbl td.c{text-align:center;white-space:nowrap}
.exp{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;font-size:14px;line-height:1.85}
.exp .tag{display:inline-block;background:#f0f3f7;color:var(--gray);border-radius:4px;padding:2px 8px;font-size:12px;margin-right:8px}
.exp .right{color:var(--ok);font-weight:700}
.exp .wrong{color:var(--bad);font-weight:700}
.copy-out{width:100%;height:132px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;
          font:12.5px/1.6 Consolas,monospace;resize:vertical}
.foot{text-align:center;color:var(--gray);font-size:12.5px;padding:20px 10px 4px}
.foot a{color:var(--blue);text-decoration:none}
#sheetToggle{display:none}
@media(max-width:860px){
  .wrap{grid-template-columns:1fr;padding:70px 10px 92px}
  .q-area{padding:16px 14px 20px}
  .q-stem{font-size:16px}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:288px;z-index:80;overflow:auto;border-radius:0;
         transform:translateX(105%);transition:.22s;padding-top:70px}
  .sheet.open{transform:none;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
  #sheetToggle{display:inline-block}
  .hd .sub{display:none}
  .bar{gap:8px}.bar .btn{padding:8px 10px;font-size:13px}
}
</style>
</head>
<body>

<header class="hd">
  <a class="logo" href="index.html">系统架构设计师</a>
  <span class="sub">综合知识 · 模拟试卷（二）</span>
  <span class="spacer"></span>
  <span class="timer" id="timer">150:00</span>
  <button class="btn" id="sheetToggle">答题卡</button>
  <button class="btn primary" id="btnSubmit">交卷</button>
</header>

<div class="wrap">
  <main class="card q-area">
    <div class="q-top">
      <span class="q-no" id="qNo">第 1 / 75 题</span>
      <button class="btn" id="btnMark" style="padding:6px 12px;font-size:13px">标记本题</button>
    </div>
    <div class="q-stem" id="qStem"></div>
    <div class="opts" id="qOpts"></div>
    <div id="qExp"></div>
  </main>

  <aside class="card sheet" id="sheet">
    <h3>答题卡 <span id="sheetSum">已答 0 / 75</span></h3>
    <div class="lg">
      <span><i style="background:var(--blue)"></i>已答</span>
      <span><i style="background:#fff;border:1px solid var(--line)"></i>未答</span>
      <span><i style="background:var(--warn)"></i>标记</span>
      <span><i style="background:var(--ok)"></i>答对</span>
      <span><i style="background:var(--bad)"></i>答错</span>
    </div>
    <div class="grid" id="grid"></div>
  </aside>
</div>

<footer class="bar">
  <button class="btn" id="btnPrev">← 上一题</button>
  <span class="prog" id="prog">已答 0 / 75</span>
  <button class="btn" id="btnNext">下一题 →</button>
  <button class="btn" id="btnMark2">标记本题</button>
  <button class="btn danger" id="btnReset">重新开始</button>
</footer>

<!-- 开始遮罩 -->
<div class="mask" id="mask">
  <div class="box">
    <h2>系统架构设计师 · 综合知识</h2>
    <div class="desc">模拟试卷（二） · 机考仿真</div>
    <table>
      <tr><td>题量</td><td>75 题（单项选择，每题 4 个选项）</td></tr>
      <tr><td>分值</td><td>每题 1 分，满分 75 分</td></tr>
      <tr><td>及格线</td><td><b>45 分</b>（≥45 即通过）</td></tr>
      <tr><td>时长</td><td>150 分钟（倒计时结束自动交卷）</td></tr>
      <tr><td>说明</td><td>点击选项即作答；右侧答题卡可跳题、标记；交卷后自动判分并生成错题清单</td></tr>
    </table>
    <div class="acts">
      <button class="btn primary" id="btnStart" style="padding:11px 26px">开始考试</button>
      <button class="btn hide" id="btnResume" style="padding:11px 22px">继续上次作答</button>
    </div>
  </div>
</div>

<script>
/* ================= 题库（75题） ================= */
var QUESTIONS = [
{n:1,t:'可靠性计算',q:'某系统由两个可靠度均为 0.9 的部件构成，其中一个作为冗余备份与主部件并联工作。该系统的可靠度约为多少？',
 o:['0.81','0.90','0.99','1.80'],a:2,
 e:'并联系统 R = 1 −(1 − r)^n = 1 −(1 − 0.9)² = 1 − 0.01 = 0.99；串联才是 0.9×0.9 = 0.81。'},

{n:2,t:'性能指标',q:'某系统把 CPU 主频提高一倍，但整体性能只提升约 30%。最可能的原因是',
 o:['存在无法并行的串行部分，限制了整体加速','磁盘 I/O 成为新瓶颈，写入速度跟不上计算速度','内存容量不足，频繁发生换页导致处理停顿','操作系统未开启多核，单核无法发挥全部性能'],a:0,
 e:'Amdahl 定律指出系统加速比受串行部分限制，串行比例越大，单纯提升并行部件性能收益越小。'},

{n:3,t:'系统配置',q:'两台服务器同时运行同一个应用并共同对外提供服务，一台故障时另一台自动接管全部负载。这种配置方式称为',
 o:['双机热备','双机互备','双机冷备','双机双工'],a:3,
 e:'双机双工是两台机器跑同一应用、负载均衡并互为冗余；热备是一干一闲，互备是各跑不同应用互相顶班。'},

{n:4,t:'存储配置',q:'某 RAID 级别允许任意一块磁盘故障而数据不丢失，且磁盘空间利用率高于 RAID1。该级别是',
 o:['RAID0','RAID5','RAID1','JBOD'],a:1,
 e:'RAID5 采用分布奇偶校验，允许坏 1 块盘，n 块盘利用率 (n−1)/n（3 块时约 66%）高于 RAID1 的 50%；RAID0 无冗余。'},

{n:5,t:'嵌入式系统',q:'嵌入式系统中，把与硬件相关的底层初始化与驱动封装起来、向上层提供统一接口的软件层是',
 o:['应用层：面向用户的业务逻辑实现','文件系统：负责存储空间分配与回收','设备驱动层：直接读写硬件寄存器与中断','板级支持包 BSP：封装硬件相关底层'],a:3,
 e:'BSP（板级支持包）位于硬件与操作系统之间，完成硬件初始化并提供驱动接口，是嵌入式系统移植的关键层。'},

{n:6,t:'操作系统',q:'在分时系统中，如果把时间片设置得过大，时间片轮转调度算法会退化成哪种算法？',
 o:['优先级调度','短作业优先','先来先服务','高响应比优先'],a:2,
 e:'时间片大到超过多数进程的一次执行时间时，进程一次就能跑完，轮转失去意义，退化为先来先服务 FCFS。'},

{n:7,t:'操作系统',q:'下列哪一项不是产生死锁的必要条件？',
 o:['资源可被其他进程抢占','进程互斥地使用资源','进程请求新资源时保持已有资源','存在进程与资源的循环等待'],a:0,
 e:'死锁四个必要条件是互斥、请求并保持、不可剥夺、循环等待。"资源可被抢占"恰好破坏不可剥夺条件，反而不是必要条件。'},

{n:8,t:'操作系统',q:'请求分页系统中，页面置换算法选择不当，导致刚被换出的页面立即又被访问，系统大部分时间都花在换页上。这种现象称为',
 o:['缺页中断','抖动','内存碎片','资源死锁'],a:1,
 e:'抖动（颠簸）指页面在内存与外存间频繁换入换出，CPU 有效利用率急剧下降，可通过增加物理块或改进置换算法缓解。'},

{n:9,t:'计算机网络',q:'在 TCP/IP 体系中，负责提供端到端可靠传输、并进行流量控制与差错恢复的层次是',
 o:['传输层','网络层','数据链路层','应用层'],a:0,
 e:'传输层的 TCP 提供面向连接的可靠端到端传输（确认重传、流量控制、拥塞控制）；网络层只负责尽力而为的寻址与转发。'},

{n:10,t:'计算机网络',q:'下列协议中，用于把 IP 地址解析为物理地址（MAC 地址）的是',
 o:['DNS','ICMP','DHCP','ARP'],a:3,
 e:'ARP 地址解析协议负责 IP→MAC 的映射；DNS 做域名解析，ICMP 传控制报文，DHCP 动态分配 IP。'},

{n:11,t:'计算机网络',q:'某公司获得 192.168.1.0/24 网段，需要划分出至少 6 个可用子网，且每个子网不少于 25 台主机。最合适的子网掩码是',
 o:['/26（4 个子网，每子网 62 台）','/27（8 个子网，每子网 30 台）','/28（16 个子网，每子网 14 台）','/29（32 个子网，每子网 6 台）'],a:1,
 e:'子网数 ≥6 需借 3 位（2³=8 个），此时掩码 /27，主机位 5 位 → 可用主机 2⁵−2 = 30 ≥25；/26 只有 4 个子网不满足，/28 每子网仅 14 台不满足。'},

{n:12,t:'数据库设计',q:'关系模式 R(学号, 姓名, 系号, 系主任)，其中 学号→姓名、学号→系号、系号→系主任。该关系模式最高满足第几范式？',
 o:['1NF','3NF','2NF','BCNF'],a:2,
 e:'所有非主属性都完全依赖于主键学号，满足 2NF；但存在 学号→系号→系主任 的传递依赖，不满足 3NF，故最高为 2NF。'},

{n:13,t:'事务管理',q:'事务隔离级别中，能够避免脏读、但仍可能出现不可重复读的是哪一个？',
 o:['读未提交','可重复读','串行化','读已提交'],a:3,
 e:'读已提交只能读到已提交数据，避免脏读，但同一事务内两次读同一数据可能得到不同结果（不可重复读）。'},

{n:14,t:'数据库索引',q:'某表建立了联合索引 (a, b, c)，下列查询中无法有效利用该索引的是',
 o:['WHERE b = 1 AND c = 2','WHERE a = 1 AND b = 2','WHERE a = 1 AND b = 2 AND c = 3','WHERE a = 1'],a:0,
 e:'联合索引遵循最左前缀原则：条件中缺少最左列 a 时，索引无法被有效利用。'},

{n:15,t:'分库分表',q:'单表数据量过大准备分库分表时，必须在分片前完成、否则后续查询与统计难以进行的工作是',
 o:['增加从库数量，把读压力分散到多台机器','提升单机 CPU 主频与内存容量上限','选定分片键并规划全局唯一 ID 方案','更换数据库版本并开启新的存储引擎'],a:2,
 e:'分片键决定数据分布与查询路由，全局唯一 ID 保证跨片主键不冲突，这两项必须在分片前确定，事后调整成本极高。'},

{n:16,t:'分布式数据库',q:'根据 CAP 定理，优先保证可用性与分区容错性、允许数据在一段时间内不一致的系统属于哪一类？',
 o:['CA','AP','CP','ACID'],a:1,
 e:'AP 系统（如多数 NoSQL）在网络分区时选择继续提供服务而放弃强一致；CP 系统则牺牲可用性保证一致性。'},

{n:17,t:'分布式事务',q:'与 Saga 模式相比，两阶段提交（2PC）的主要缺点是什么？',
 o:['无法保证跨库事务的原子性','只适用于同构数据库与同一厂商','每个分支都必须人工编写补偿逻辑','同步阻塞、协调者单点、性能差'],a:3,
 e:'2PC 在准备阶段全程加锁并同步等待，协调者故障会导致参与者长期阻塞，性能与可用性都较差；人工补偿是 Saga 的特点。'},

{n:18,t:'分布式缓存',q:'大量请求同时查询同一个刚刚过期的热点 key，导致请求全部涌向数据库，这种现象称为',
 o:['缓存击穿','缓存雪崩','缓存穿透','缓存预热'],a:0,
 e:'击穿指单个热点 key 失效瞬间被高并发直击；雪崩是大量 key 同时失效；穿透是查询根本不存在的 key。'},

{n:19,t:'信息安全',q:'某系统既要加密业务数据、又要把加密密钥安全地传给对方。最合适的做法是',
 o:['双方各自使用相同的 DES 密钥加密数据','使用 RSA 直接加密全部业务数据（较慢）','用 RSA 传递对称密钥，再对称加密数据','使用哈希算法对业务数据做加密处理'],a:2,
 e:'混合加密：用非对称算法安全传递对称密钥，再用高效的对称算法加密大数据量业务数据，HTTPS 即采用此方案。'},

{n:20,t:'认证授权',q:'某平台采用"用户—角色—权限"三层模型，用户通过被赋予角色间接获得权限。这种访问控制模型是',
 o:['强制访问控制 MAC','基于角色的访问控制 RBAC','自主访问控制 DAC','基于属性的访问控制 ABAC'],a:1,
 e:'RBAC 以角色为中介解耦用户与权限，便于批量授权与职责分离，是企业系统最常用的访问控制模型。'},

{n:21,t:'信息安全',q:'我国网络安全等级保护制度中，等级保护对象的安全保护等级共分为几级？',
 o:['二级','三级','四级','五级'],a:3,
 e:'等保 2.0 将保护等级分为五级，一级最低、五级最高，级别越高要求的管控措施越严格。'},

{n:22,t:'网络安全',q:'能够检测并阻断 SQL 注入、跨站脚本等针对 Web 应用攻击的设备是',
 o:['包过滤防火墙（网络层过滤）','入侵检测系统 IDS（只检测不阻断）','Web 应用防火墙 WAF','漏洞扫描器（扫描已知漏洞）'],a:2,
 e:'WAF 工作在应用层，针对 HTTP 流量识别并阻断注入、XSS 等 Web 攻击；防火墙管网络层，IDS 只检测不阻断，扫描器只发现漏洞。'},

{n:23,t:'信息安全',q:'信息系统的安全属性中，"完整性"指的是什么？',
 o:['传输与存储过程中未被非法篡改','数据不被未授权的用户读取或窃取','授权用户可以随时正常访问与使用','用户无法否认自己曾经发送过信息'],a:0,
 e:'完整性针对"未被非法篡改"；不被未授权读取是保密性，随时可用是可用性，无法否认是不可抵赖性。'},

{n:24,t:'需求分析',q:'数据流图（DFD）中，用于描述把输入数据转换为输出数据的加工处理环节的元素是',
 o:['外部实体（方框）','加工（处理）','数据存储（矩形）','数据流（箭头）'],a:1,
 e:'DFD 四要素：外部实体（方框）、加工（圆角矩形/圆）、数据存储（开口矩形）、数据流（箭头）；"加工"负责数据变换。'},

{n:25,t:'软件测试',q:'只依据程序内部逻辑结构设计用例，要求程序中每条可执行语句至少执行一次的覆盖标准是',
 o:['等价类划分','边界值分析','判定覆盖','语句覆盖'],a:3,
 e:'语句覆盖属于白盒测试中较弱的覆盖标准；判定（分支）覆盖强于语句覆盖；等价类与边界值属于黑盒方法。'},

{n:26,t:'软件维护',q:'为改进软件将来的可维护性与可测试性而重新构造代码、且不改变其外部行为的维护活动属于',
 o:['改正性维护','适应性维护','预防性维护','完善性维护'],a:2,
 e:'预防性维护（如重构）目的是提高未来可维护性；改正性修缺陷、适应性应对环境变化、完善性增加新功能。'},

{n:27,t:'开发模型',q:'适用于大型复杂项目、强调在每个阶段进行风险分析的软件开发模型是',
 o:['螺旋模型','瀑布模型','快速原型模型','V 模型'],a:0,
 e:'螺旋模型把开发过程组织为多轮螺旋，每轮包含风险分析，适合大型高风险项目；瀑布模型线性推进且不支持回溯。'},

{n:28,t:'软件过程管理',q:'CMMI 中，"组织已建立标准过程并被全组织采用"对应的是哪一级？',
 o:['2 级 已管理','4 级 量化管理','5 级 优化','3 级 已定义'],a:3,
 e:'CMMI 3 级（已定义）要求组织建立并推广标准过程；2 级只到项目级管理，4 级用量化数据控制过程，5 级持续优化。'},

{n:29,t:'软件工程',q:'下列耦合类型中，耦合程度最高（最差）的是哪一种？',
 o:['公共耦合','内容耦合','控制耦合','标记耦合'],a:1,
 e:'耦合由低到高：非直接 < 数据 < 标记 < 控制 < 外部 < 公共 < 内容；内容耦合直接访问对方内部数据或代码，最差。'},

{n:30,t:'软件工程',q:'一个模块内各成分全部为了完成同一个功能而存在、缺一不可，这种内聚属于',
 o:['逻辑内聚','时间内聚','功能内聚','通信内聚'],a:2,
 e:'功能内聚是最高级别的内聚，模块只完成一个单一功能；逻辑内聚与时间内聚都是较低级别的内聚。'},

{n:31,t:'UML',q:'UML 图中，用于描述系统与外部参与者之间功能交互的是哪一种图？',
 o:['用例图','类图','顺序图','活动图'],a:0,
 e:'用例图从外部视角描述参与者与系统功能（用例）的交互；类图描述静态结构，顺序图与活动图描述动态行为。'},

{n:32,t:'UML',q:'UML 类图中，表示"整体与部分"关系、且部分可以脱离整体独立存在的是哪种关系？',
 o:['泛化','聚合','组合','依赖'],a:1,
 e:'聚合用空心菱形表示，部分可独立于整体存在（如班级与学生）；组合用实心菱形表示，部分随整体消亡（如人与心脏）。'},

{n:33,t:'UML',q:'UML 图中，强调消息在对象之间按时间先后顺序传递的是哪一种图？',
 o:['通信图','活动图','状态图','顺序图'],a:3,
 e:'顺序图（时序图）以纵轴表示时间、横向排列对象，突出消息的时间顺序；通信图强调对象之间的链接关系。'},

{n:34,t:'设计模式',q:'希望把对象的创建过程封装起来，使客户端不依赖具体产品类，最适合采用哪种设计模式？',
 o:['观察者模式（通知）','策略模式（可替换）','工厂方法模式','适配器模式（转换）'],a:2,
 e:'工厂方法把创建延迟到子类，客户端只面向产品接口编程，新增产品时无需修改客户端代码。'},

{n:35,t:'设计模式',q:'在不修改原有类的前提下，动态地给对象增加额外职责，最适合采用哪种设计模式？',
 o:['装饰器模式','代理模式（控制访问）','桥接模式（分离抽象）','享元模式（共享对象）'],a:0,
 e:'装饰器通过持有被装饰对象并层层包装来动态扩展职责；代理控制对对象的访问，桥接分离抽象与实现，享元共享细粒度对象。'},

{n:36,t:'设计模式',q:'定义一个算法的骨架，把其中某些可变步骤延迟到子类实现，这种模式是',
 o:['策略模式（替换算法）','模板方法模式','状态模式（驱动行为）','责任链模式（逐级传递）'],a:1,
 e:'模板方法在父类固定算法骨架、把可变步骤定义为抽象方法由子类实现；策略模式则是把整个算法替换为可互换的策略对象。'},

{n:37,t:'软件架构风格',q:'系统以数据为中心，各构件共享同一数据存储、彼此之间不直接通信，这类架构风格属于',
 o:['数据流风格（依次流过）','调用返回风格（层层调用）','独立构件风格（消息驱动）','仓库（数据共享）风格'],a:3,
 e:'仓库风格（含数据库系统与黑板系统）以中央数据结构为核心，构件只与仓库交互；数据流风格强调数据依次流经处理构件。'},

{n:38,t:'软件架构风格',q:'分层架构风格的主要缺点是什么？',
 o:['层次划分不当会影响性能，且合理的层次边界难以确定','构件之间耦合度偏高，导致替换单个构件非常困难','完全不支持并发处理与异步消息通信机制','已有构件无法复用，必须全部重新开发与测试'],a:1,
 e:'分层的代价是请求需逐层穿透带来性能损耗，且"哪些逻辑放哪层"难以界定；耦合度高是紧耦合风格的问题，不是分层的典型缺点。'},

{n:39,t:'软件架构风格',q:'某系统把业务规则从代码中抽离，运行时由引擎解释执行规则脚本，修改规则无需重新编译。这种风格是',
 o:['管道—过滤器（数据流风格）','事件驱动（隐式调用风格）','解释器（虚拟机）风格','层次结构（分层调用风格）'],a:2,
 e:'解释器风格包含解释引擎与被解释的程序/规则，通过解释执行获得灵活性；规则系统属于解释器风格的一种典型应用。'},

{n:40,t:'架构视图',q:'4+1 视图模型中，描述系统并发与同步、关注进程与线程组织方式的是哪个视图？',
 o:['逻辑视图','进程视图','开发视图','物理视图'],a:1,
 e:'进程视图关注并发、同步、性能与可用性；逻辑视图关注功能与对象，开发视图关注模块组织，物理视图关注部署节点。'},

{n:41,t:'架构描述',q:'关于 ADL（架构描述语言），下列说法正确的是哪一项？',
 o:['形式化描述构件、连接件与配置，支持架构分析','是一种可直接编译为可执行程序的编程语言','只能描述系统静态结构，无法描述任何动态行为','与 UML 完全等价，两者可以互相替代使用'],a:0,
 e:'ADL 的核心三要素是构件、连接件与架构配置，可对架构做一致性检查与行为分析；它不是编程语言，也不能被 UML 完全替代。'},

{n:42,t:'中间件',q:'下列中间件中，主要用于屏蔽异构数据库差异、实现统一 SQL 访问的是哪一类？',
 o:['消息中间件（解耦）','事务中间件（分布式）','对象中间件（远程）','数据库访问中间件'],a:3,
 e:'数据库访问中间件（如 JDBC、MyCat）对上提供统一访问接口，屏蔽不同数据库的差异；消息中间件解决异步通信，事务中间件保障分布式事务。'},

{n:43,t:'微服务架构',q:'微服务架构中，服务实例地址会动态变化，调用方无需硬编码地址即可找到可用实例，依靠的核心机制是',
 o:['负载均衡算法（转发）','分布式锁（互斥访问）','服务注册与发现','分布式事务（跨库）'],a:2,
 e:'服务实例启动时向注册中心登记、下线时注销，调用方按服务名查询实例列表并结合负载均衡发起调用。'},

{n:44,t:'服务治理',q:'当系统流量超过处理能力时，主动拒绝或排队部分请求以保护核心业务不被拖垮的手段是',
 o:['熔断','限流','降级','隔离'],a:1,
 e:'限流控制进入系统的请求速率；熔断是下游故障时快速失败，降级是提供简化功能，隔离是把资源池分开避免相互影响。'},

{n:45,t:'软件复用',q:'在基于构件的软件复用中，接口与契约的主要作用是什么？',
 o:['明确构件对外提供与需要的服务，可独立替换','规定构件内部的实现算法，便于进行性能优化','描述构件的部署拓扑结构与运行节点分布','记录构件的历史缺陷与历次修复过程信息'],a:0,
 e:'接口与契约界定构件的边界与语义约定，使构件可组装、可替换，这是构件复用的前提；契约不约束内部实现。'},

{n:46,t:'企业集成',q:'企业服务总线（ESB）在系统集成中的核心作用是什么？',
 o:['集中存储企业的全部业务数据与文件','渲染前端页面并统一管理页面路由','提供消息路由、协议转换与中介能力','负责源代码的编译打包与版本发布'],a:2,
 e:'ESB 提供消息路由、协议转换、数据格式转换与服务编排等中介能力，降低异构系统之间的直接耦合（这也是微服务去 ESB 的原因）。'},

{n:47,t:'微服务架构',q:'微服务拆分的边界划分，最重要的原则是什么？',
 o:['按代码行数尽量平均地切分，保证每人工作量一致','按业务能力划分边界，做到高内聚低耦合','按开发团队人数平均切分，便于责任到人','按数据库表的数量切分，每表一个服务'],a:1,
 e:'微服务应按业务能力/领域边界拆分，使服务内部高内聚、服务之间低耦合；按行数、人数、表数拆分都会破坏业务完整性。'},

{n:48,t:'服务治理',q:'服务降级指的是什么？',
 o:['直接把故障服务从注册中心下线','增加服务实例数量以提升整体处理能力','提高服务接口的调用频率与并发度上限','依赖不可用时提供简化功能或默认返回'],a:3,
 e:'降级是在资源不足或依赖故障时牺牲非核心功能、保证核心链路可用；下线是摘除实例，扩容是提升容量。'},

{n:49,t:'架构评估',q:'在架构评估中，"同时影响多个质量属性的设计决策点"被称为',
 o:['敏感点','风险点','非风险点','权衡点'],a:3,
 e:'只影响一个质量属性的关键决策是敏感点；同时影响多个质量属性、需要取舍的是权衡点；可能妨碍质量目标达成的是风险点。'},

{n:50,t:'质量属性',q:'质量属性中，衡量"系统在规定条件和规定时间内正确完成规定功能的概率"的是哪一个？',
 o:['可靠性','可用性','性能','可测试性'],a:0,
 e:'可靠性关注长时间无故障运行的能力（MTBF 等）；可用性关注故障发生时系统仍能提供服务的能力。'},

{n:51,t:'质量属性场景',q:'在质量属性场景中，"用户发起一次查询请求"属于六要素中的哪一项？',
 o:['响应','环境','刺激','响应度量'],a:2,
 e:'六要素为刺激源、刺激、环境、工件、响应、响应度量；发起请求是"刺激"，系统处理结果是"响应"，200ms 之类是响应度量。'},

{n:52,t:'架构评估',q:'ATAM 评估中，"可能导致质量目标无法达成的架构决策"被称为',
 o:['敏感点','权衡点','非风险点','风险点'],a:3,
 e:'风险点是可能带来隐患的架构决策；敏感点影响单一质量属性，权衡点影响多个质量属性，非风险点是经分析确认安全的决策。'},

{n:53,t:'可靠性',q:'某系统的平均无故障时间 MTBF = 1000 小时，平均修复时间 MTTR = 20 小时。该系统的可用性约为多少？',
 o:['95.2%','98.0%','99.0%','50.0%'],a:1,
 e:'可用性 = MTBF ÷（MTBF + MTTR）= 1000 ÷ 1020 ≈ 98.0%。缩短 MTTR 或提高 MTBF 都能提升可用性。'},

{n:54,t:'可用性设计',q:'为提高系统可用性，采用"主备切换 + 心跳检测"方案的主要作用是什么？',
 o:['及时发现故障节点并切换到备用节点','提升单台服务器的 CPU 处理能力','减少数据存储所占用磁盘空间','缩短应用代码的编译与构建时间'],a:0,
 e:'心跳用于检测节点存活，检测到故障后由主备切换机制把服务转移到备用节点，属于典型的故障检测与恢复手段。'},

{n:55,t:'性能测试',q:'在性能测试中，系统负载不断上升时"响应时间"与"吞吐量"的典型关系是',
 o:['负载上升时两者始终同步上升，不会出现任何背离','响应时间与吞吐量之间不存在任何相关关系','超过拐点后吞吐量不再上升，响应时间急剧增加','吞吐量越高，响应时间必然越短'],a:2,
 e:'负载在拐点之前，吞吐量随负载上升而响应时间基本平稳；越过拐点后资源饱和，吞吐量不再增长而响应时间急剧恶化。'},

{n:56,t:'架构演化',q:'把单体应用逐步拆分为微服务的过程中，最容易被忽视、但影响最大的问题是',
 o:['服务器数量不足需要扩容','数据一致性与分布式事务','前端页面样式不统一','开发人员数量不够'],a:1,
 e:'拆分后原本一个数据库事务变成跨服务调用，必须引入最终一致性、补偿或分布式事务方案，这是架构演化中最难的部分。'},

{n:57,t:'分布式锁',q:'基于 Redis 实现分布式锁时，为防止持锁进程崩溃导致锁永不释放，必须为锁设置什么？',
 o:['主键索引（唯一）','缓存预热（预加载）','数据分片（拆分）','过期时间（TTL）'],a:3,
 e:'给锁设置 TTL 可以让异常持有的锁自动释放；进一步还需保证"加锁与设过期"的原子性并校验持有者标识。'},

{n:58,t:'消息队列',q:'Kafka 中，同一个消费者组内多个消费者并行消费同一个主题时，并行度的上限取决于什么？',
 o:['主题的分区数量','消费者的线程数','单条消息的大小','磁盘的读写速度'],a:0,
 e:'Kafka 中一个分区只能被同组内的一个消费者消费，因此并行度上限等于分区数，分区数不足时可考虑扩容分区。'},

function srcOf(q){ return SRC[q.t] || ('考点：' + q.t); }

/* ================= 状态与逻辑 ================= */
var TOTAL = 75, PASS = 45, FULL = 150 * 60;
var KEY = 'mock_zonghe_2_v1';
var st = { i:0, ans:{}, mk:{}, sub:false, left:FULL, t:null, run:false };

var $ = function(id){ return document.getElementById(id); };
var LT = ['A','B','C','D'];

function fmt(s){ var m = Math.floor(s/60), x = s%60; return (m<10?'0':'')+m+':'+(x<10?'0':'')+x; }

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({ans:st.ans, mk:st.mk, i:st.i, left:st.left, run:st.run, sub:st.sub}));
  }catch(e){}
}
function load(){
  try{ var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ---- 渲染 ---- */
function render(){
  var q = QUESTIONS[st.i];
  $('qNo').textContent = '第 ' + (st.i+1) + ' / ' + TOTAL + ' 题';
  $('qStem').textContent = q.n + '. ' + q.q;
  var box = $('qOpts'); box.innerHTML = '';
  for(var k=0;k<4;k++){
    (function(k){
      var d = document.createElement('div');
      d.className = 'opt';
      var cls = '';
      if(st.sub){
        if(k === q.a) cls = ' right';
        else if(st.ans[q.n] === k) cls = ' wrong';
      }else if(st.ans[q.n] === k){ cls = ' sel'; }
      d.className = 'opt' + cls;
      d.innerHTML = '<span class="lt">' + LT[k] + '</span><span class="tx"></span>';
      d.querySelector('.tx').textContent = q.o[k];
      d.onclick = function(){ pick(q.n, k); };
      box.appendChild(d);
    })(k);
  }
  var exp = $('qExp');
  if(st.sub){
    var mine = (st.ans[q.n] === undefined) ? '未作答' : LT[st.ans[q.n]];
    var ok = st.ans[q.n] === q.a;
    exp.innerHTML = '<div class="exp">'
      + '<div><span class="tag">教材出处</span>' + srcOf(q) + '</div>'
      + '<div style="margin-top:6px"><span class="tag">答案</span>正确答案：<span class="right">' + LT[q.a] + '</span>　你的答案：<span class="' + (ok?'right':'wrong') + '">' + mine + '</span></div>'
      + '<div style="margin-top:6px"><span class="tag">解析</span>' + q.e + '</div></div>';
  }else{ exp.innerHTML = ''; }
  var m = !!st.mk[q.n];
  $('btnMark').textContent = m ? '取消标记' : '标记本题';
  $('btnMark2').textContent = m ? '取消标记' : '标记本题';
  $('btnPrev').disabled = (st.i === 0);
  $('btnNext').disabled = (st.i === TOTAL-1);
  renderGrid();
}
function renderGrid(){
  var g = $('grid'); g.innerHTML = '';
  for(var i=1;i<=TOTAL;i++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'gi';
      if(st.sub){
        if(st.ans[i] === undefined) d.className += ' skip';
        else d.className += (st.ans[i] === QUESTIONS[i-1].a ? ' ok' : ' no');
      }else if(st.ans[i] !== undefined){ d.className += ' done'; }
      if(st.mk[i]) d.className += ' mark';
      if(i === st.i+1) d.className += ' cur';
      d.textContent = i;
      d.onclick = function(){ st.i = i-1; render(); document.querySelector('.q-area').scrollIntoView({behavior:'smooth',block:'start'}); };
      g.appendChild(d);
    })(i);
  }
  var c = 0; for(var k=1;k<=TOTAL;k++){ if(st.ans[k] !== undefined) c++; }
  $('prog').textContent = '已答 ' + c + ' / ' + TOTAL;
  $('sheetSum').textContent = '已答 ' + c + ' / ' + TOTAL;
}
function pick(n, k){
  if(st.sub) return;
  st.ans[n] = k;
  save(); render();
  if(n < TOTAL && st.ans[n+1] === undefined && k !== undefined){
    setTimeout(function(){ if(st.i === n-1){ st.i = n; render(); } }, 160);
  }
}
function go(d){
  var t = st.i + d;
  if(t < 0 || t > TOTAL-1) return;
  st.i = t; render(); save();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleMark(){
  var n = st.i + 1;
  if(st.mk[n]) delete st.mk[n]; else st.mk[n] = 1;
  save(); render();
}

/* ---- 计时 ---- */
function startTimer(){
  if(st.t) return;
  st.run = true; save();
  st.t = setInterval(function(){
    st.left--;
    if(st.left <= 0){ st.left = 0; paint(); submit(true); return; }
    paint();
    if(st.left % 20 === 0) save();
  }, 1000);
}
function paint(){
  $('timer').textContent = fmt(st.left);
  $('timer').className = 'timer' + (st.left <= 900 ? ' warn' : '');
}

/* ---- 交卷与判分 ---- */
function submit(auto){
  if(st.sub) return;
  var un = 0;
  for(var i=1;i<=TOTAL;i++){ if(st.ans[i] === undefined) un++; }
  if(!auto && !confirm('确认交卷？\n未作答：' + un + ' 题\n交卷后将立即判分并显示解析。')) return;
  st.sub = true; st.run = false;
  if(st.t){ clearInterval(st.t); st.t = null; }
  save();
  var score = 0, wrong = [];
  for(var i=1;i<=TOTAL;i++){
    var q = QUESTIONS[i-1], my = st.ans[i];
    if(my === q.a) score++;
    else wrong.push({n:i, my:(my === undefined ? null : my), a:q.a, t:q.t, s:srcOf(q), e:q.e});
  }
  var html = '<div class="res"><div class="score"><span class="big">' + score + '</span>'
    + '<span style="color:var(--gray)">/ ' + TOTAL + ' 分</span>'
    + '<span class="pass ' + (score >= PASS ? 'y' : 'n') + '">' + (score >= PASS ? '✅ 达到及格线 45 分' : '❌ 未达及格线（差 ' + (PASS - score) + ' 分）') + '</span></div>'
    + '<div class="stat"><span>答对 <b>' + score + '</b></span><span>答错 <b>' + (TOTAL - score - un) + '</b></span>'
    + '<span>未答 <b>' + un + '</b></span><span>用时 <b>' + fmt(FULL - st.left) + '</b></span></div>';

  if(wrong.length === 0){
    html += '<p style="color:var(--ok);font-weight:700">全对！这套卷子没有错题，可以直接进入下一套或转攻案例/论文。</p>';
  }else{
    html += '<h3 style="font-size:16px;margin:6px 0 10px">错题清单（' + wrong.length + ' 题）</h3>'
      + '<table class="wrong-tbl"><tr><th>题号</th><th>考点</th><th>教材出处（章 · 知识点）</th><th>你的答案</th><th>正确答案</th><th>一句话纠正</th></tr>';
    for(var j=0;j<wrong.length;j++){
      var w = wrong[j];
      html += '<tr><td class="c">' + w.n + '</td><td>' + w.t + '</td><td>' + w.s + '</td><td class="c" style="color:var(--bad)">'
        + (w.my === null ? '未答' : LT[w.my]) + '</td><td class="c" style="color:var(--ok)">' + LT[w.a] + '</td><td>'
        + w.e + '</td></tr>';
    }
    html += '</table>';
  }
  html += '<h3 style="font-size:16px;margin:22px 0 6px">把结果发给 AI 做深度评审</h3>'
    + '<p style="font-size:13.5px;color:var(--gray)">点下方按钮复制，粘贴到对话里，我会逐题讲错因、归类错题并给一句话锚点。</p>'
    + '<textarea class="copy-out" id="copyOut" readonly></textarea>'
    + '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">'
    + '<button class="btn primary" id="btnCopy">复制答题结果</button>'
    + '<button class="btn" id="btnExport">下载成绩文件（给 AI 统计用）</button>'
    + '<button class="btn" id="btnReview">逐题看解析（从第 1 题开始）</button>'
    + '<button class="btn danger" id="btnReset2">重新开始</button></div>'
    + '<p style="font-size:12.5px;color:var(--gray);margin-top:8px">成绩文件会保存到浏览器下载目录（一般叫「下载 / Downloads」），里面含完整答题卡、得分、逐题错因与教材出处，AI 可直接读取做统计与反哺。</p></div>';

  var host = document.createElement('div');
  host.className = 'card'; host.id = 'resCard';
  host.innerHTML = html;
  var wrap = document.querySelector('.wrap');
  wrap.parentNode.insertBefore(host, wrap);
  host.style.maxWidth = '1220px'; host.style.margin = '74px auto -74px';

  // 生成可复制文本
  var txt = '【模拟考试·综合知识（二）】得分 ' + score + '/75（及格线45）\n'
    + '答对 ' + score + ' 题，答错 ' + (TOTAL - score - un) + ' 题，未答 ' + un + ' 题，用时 ' + fmt(FULL - st.left) + '\n'
    + (wrong.length ? '错题明细（含教材出处）：\n' + wrong.map(function(w){ return '  Q' + w.n + '｜' + w.s + '｜我选 ' + (w.my===null?'未答':LT[w.my]) + '，正确 ' + LT[w.a]; }).join('\n') : '无错题');
  $('copyOut').value = txt;
  $('btnCopy').onclick = function(){
    var t = $('copyOut'); t.removeAttribute('readonly'); t.select();
    try{ document.execCommand('copy'); }catch(e){}
    try{ navigator.clipboard.writeText(txt); }catch(e){}
    t.setAttribute('readonly','readonly');
    $('btnCopy').textContent = '已复制 ✓';
    setTimeout(function(){ $('btnCopy').textContent = '复制答题结果'; }, 1800);
  };
  // 下载成绩文件（JSON）：让 AI 能直接读取并统计/反哺
  $('btnExport').onclick = function(){
    var d = new Date();
    var pad = function(x){ return (x < 10 ? '0' : '') + x; };
    var stamp = d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
    var sheet = {};
    for(var i=1;i<=TOTAL;i++){ sheet['Q' + i] = (st.ans[i] === undefined ? null : LT[st.ans[i]]); }
    var data = {
      paper: '模拟考试-综合二（系统架构设计师 · 综合知识）',
      finishedAt: d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()),
      score: score, total: TOTAL, passLine: PASS, passed: (score >= PASS),
      correct: score, wrong: (TOTAL - score - un), unanswered: un,
      timeUsed: fmt(FULL - st.left), timeLeft: fmt(st.left),
      answerSheet: sheet,
      wrongDetail: wrong.map(function(w){
        return { no: w.n, source: w.s, mine: (w.my === null ? null : LT[w.my]), correct: LT[w.a], note: w.e };
      }),
      sourceStats: (function(){
        var m = {};
        wrong.forEach(function(w){ var k = w.s.split(' · ')[0]; m[k] = (m[k] || 0) + 1; });
        return m;
      })()
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '模拟考试-综合二_成绩_' + stamp + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 600);
    $('btnExport').textContent = '已下载 ✓（到下载目录拿文件）';
  };
  $('btnReview').onclick = function(){ st.i = 0; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  $('btnReset2').onclick = reset;
  $('timer').textContent = fmt(st.left);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function reset(){
  if(!confirm('确定重新开始？当前作答记录会被清空。')) return;
  clearSave();
  st = { i:0, ans:{}, mk:{}, sub:false, left:FULL, t:null, run:false };
  var r = $('resCard'); if(r) r.parentNode.removeChild(r);
  paint(); render(); save();
}

/* ---- 事件绑定 ---- */
$('btnPrev').onclick = function(){ go(-1); };
$('btnNext').onclick = function(){ go(1); };
$('btnMark').onclick = toggleMark;
$('btnMark2').onclick = toggleMark;
$('btnSubmit').onclick = function(){ submit(false); };
$('btnReset').onclick = reset;
$('sheetToggle').onclick = function(){ $('sheet').classList.toggle('open'); };
$('btnStart').onclick = function(){
  $('mask').classList.add('hide');
  startTimer(); render();
};
$('btnResume').onclick = function(){
  $('mask').classList.add('hide');
  if(st.sub){ /* 已交卷，直接看解析 */ }
  else startTimer();
  render();
};
document.addEventListener('keydown', function(e){
  if(st.sub) return;
  var k = e.key.toUpperCase();
  if(['A','B','C','D'].indexOf(k) >= 0 && !st.sub){ pick(st.i+1, ['A','B','C','D'].indexOf(k)); }
  else if(e.key === 'ArrowRight'){ go(1); }
  else if(e.key === 'ArrowLeft'){ go(-1); }
});
window.addEventListener('beforeunload', function(e){
  if(st.run && !st.sub){ save(); e.preventDefault(); e.returnValue = ''; }
});

/* ---- 初始化 ---- */
(function init(){
  var s = load();
  if(s && s.ans && Object.keys(s.ans).length){
    st.i = s.i || 0; st.ans = s.ans; st.mk = s.mk || {}; st.left = s.left || FULL; st.sub = !!s.sub;
    $('btnResume').classList.remove('hide');
    $('btnStart').textContent = '重新开始（放弃上次记录）';
    $('btnStart').onclick = function(){ reset(); $('mask').classList.add('hide'); startTimer(); };
  }
  paint(); render();
})();
</script>
</body>
</html>
